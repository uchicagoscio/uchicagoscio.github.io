<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UChicago Science Olympiad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .header-section {
            position: relative;
            height: 70vh;
            background: linear-gradient(rgba(139, 69, 19, 0.3), rgba(139, 69, 19, 0.5)), 
                        url('images/banner.png') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .logo-image {
            max-width: 600px;
            max-height: 300px;
            width: auto;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .logo-image:hover {
            transform: scale(1.05);
        }

        .nav-menu {
            position: absolute;
            top: 50px;
            right: 50px;
            display: flex;
            gap: 30px;
            z-index: 10;
        }

        .nav-item {
            background: rgba(255, 255, 255, 0.9);
            color: #800000;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-item:hover {
            background: #800000;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        .contact-panel {
            background: #4a4a4a;
            color: white;
            padding: 40px;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .contact-image {
            max-width: 200px;
            max-height: 150px;
            width: auto;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .contact-text {
            max-width: 600px;
        }

        @media (max-width: 768px) {
            .nav-menu {
                position: static;
                flex-direction: column;
                align-items: center;
                margin-top: 20px;
            }

            .logo-image {
                max-width: 300px;
                max-height: 150px;
            }

            .contact-panel {
                padding: 30px 20px;
            }

            .contact-image {
                max-width: 150px;
                max-height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <nav class="nav-menu">
            <a href="index.html" class="nav-item">Home</a>
            <a href="invitationals.html" class="nav-item">Invitationals</a>
            <a href="community.html" class="nav-item">In The Community</a>
            <a href="memories.html" class="nav-item">Memories</a>
            <a href="about.html" class="nav-item">About Us</a>
        </nav>

        <img src="images/title.png" alt="UChicago Science Olympiad" class="logo-image">
    </div>

    <div class="contact-panel">
        <img src="images/uchicago_logo.png" alt="UChicago Logo" class="contact-image">
        <div class="contact-text">
            Reynolds Club RC001, University of Chicago Science Olympiad<br>
            5706 S. University Ave, Chicago, IL, 60637<br>
            uchicagoscio@gmail.com
        </div>
    </div>

</body>
</html>
