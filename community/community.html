<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UChicago Science Olympiad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: #333;
        }

        /* Header Section */
        .header-section {
            position: relative;
            height: 70vh;
            background: linear-gradient(rgba(139, 69, 19, 0.3), rgba(139, 69, 19, 0.5)), 
                        url('../images/banner.png') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .logo-image {
            max-width: 600px;
            max-height: 300px;
            width: auto;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .logo-image:hover {
            transform: scale(1.05);
        }

        /* Navigation */
        .nav-menu {
            position: absolute;
            top: 50px;
            right: 50px;
            display: flex;
            gap: 30px;
            z-index: 10;
        }

        .nav-item {
            background: rgba(255, 255, 255, 0.9);
            color: #800000;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .nav-item:hover {
            background: #800000;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        /* Dropdown Styles */
        .nav-item.dropdown::after {
            content: " ▼";
            font-size: 0.7rem;
        }

        .dropdown-content {
            display: block;
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            min-width: 150px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            max-height: 0;
            transition: all 0.4s ease;
            z-index: 100;
        }

        .dropdown-content a {
            display: block;
            padding: 10px 20px;
            color: #800000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dropdown-content a:hover {
            background: #800000;
            color: white;
        }

        /* Show dropdown with slide animation */
        .nav-item.dropdown:hover .dropdown-content {
            opacity: 1;
            max-height: 500px;
        }

        /* Contact Panel */
        .contact-panel {
            background: #4a4a4a;
            color: white;
            padding: 40px;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .contact-image {
            max-width: 200px;
            max-height: 150px;
            width: auto;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .contact-text {
            max-width: 600px;
        }

        @media (max-width: 768px) {
            .nav-menu {
                position: static;
                flex-direction: column;
                align-items: center;
                margin-top: 20px;
            }

            .logo-image {
                max-width: 300px;
                max-height: 150px;
            }

            .contact-panel {
                padding: 30px 20px;
            }

            .contact-image {
                max-width: 150px;
                max-height: 100px;
            }

            .nav-item.dropdown::after {
                display: none;
            }

            .dropdown-content {
                position: static;
                max-height: none;
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <nav class="nav-menu">
            <a href="../index.html" class="nav-item">Home</a>
            
            <div class="nav-item dropdown">
                Invitationals
                <div class="dropdown-content">
                    <a href="../invitationals/info_register.html">Info + Register</a>
                    <a href="../invitationals/invitational_day.html">Invitational Day Info</a>
                    <a href="../invitationals/past_tests.html">Past Test Releases</a>
                    <a href="../invitationals/results.html">Results</a>
                </div>
            </div>
            
            <div class="nav-item dropdown">
                In The Community
                <div class="dropdown-content">
                    <a href="community/cps.html">Chicago Public Schools</a>
                    <a href="community/southside.html">Southside Clinic</a>
                </div>
            </div>

            <a href="../memories.html" class="nav-item">Memories</a>
            <a href="../about.html" class="nav-item">About Us</a>
        </nav>

        <img src="../images/title.png" alt="UChicago Science Olympiad" class="logo-image">
    </div>

    <div class="contact-panel">
        <img src="../images/uchicago_logo.png" alt="UChicago Logo" class="contact-image">
        <div class="contact-text">
            Reynolds Club RC001, University of Chicago Science Olympiad<br>
            5706 S. University Ave, Chicago, IL, 60637<br>
            uchicagoscio@gmail.com
        </div>
    </div>

</body>
</html>
