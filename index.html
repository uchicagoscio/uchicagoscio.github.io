<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UChicago Science Olympiad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: #333;
        }

        .header-section {
            position: relative;
            height: 100vh;
            background: linear-gradient(rgba(139, 69, 19, 0.3), rgba(139, 69, 19, 0.5)), 
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect fill="%23d4b896" width="1200" height="800"/><g fill="%23a0845c" opacity="0.5"><polygon points="200,150 400,150 350,250 250,250"/><polygon points="500,100 700,100 650,200 550,200"/><polygon points="800,200 1000,200 950,300 850,300"/><polygon points="100,400 300,400 250,500 150,500"/><polygon points="600,350 800,350 750,450 650,450"/><polygon points="900,450 1100,450 1050,550 950,550"/></g></svg>') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .logo-section {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .vita-excolatur {
            background: #8B4513;
            color: white;
            padding: 15px;
            border-radius: 10px;
            transform: rotate(-5deg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .vita-excolatur:hover {
            transform: rotate(-2deg) scale(1.05);
        }

        .vita-excolatur h3 {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .phoenix-icon {
            width: 60px;
            height: 60px;
            margin-top: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .main-title {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255,107,107,0.5); }
            to { text-shadow: 0 0 30px rgba(255,217,61,0.8); }
        }

        .subtitle {
            font-size: 2.5rem;
            color: #8B4513;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }

        .nav-menu {
            position: absolute;
            top: 50px;
            right: 50px;
            display: flex;
            gap: 30px;
            z-index: 10;
        }

        .nav-item {
            background: rgba(255, 255, 255, 0.9);
            color: #8B4513;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-item:hover {
            background: #8B4513;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        .content-section {
            padding: 80px 50px;
            background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
        }

        .image-gallery {
            text-align: center;
            margin: 40px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .gallery-note {
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
            font-size: 1.1rem;
        }

        .cards-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }

        .info-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #8B4513, #D2691E, #CD853F);
        }

        .info-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 2rem;
            color: #8B4513;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card-content {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #555;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #8B4513, #D2691E);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
            margin: 10px;
        }

        .btn:hover {
            background: linear-gradient(45deg, #A0522D, #F4A460);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        .center-buttons {
            text-align: center;
        }

        @media (max-width: 768px) {
            .nav-menu {
                position: static;
                flex-direction: column;
                align-items: center;
                margin-top: 20px;
            }

            .main-title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.8rem;
            }

            .cards-section {
                grid-template-columns: 1fr;
            }

            .rotating-images {
                flex-direction: column;
                align-items: center;
            }
